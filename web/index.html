<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R+V Web-Basis</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
<header class="header"><div class="container"><img src="../assets/logo/ruv-logo_ohne-claim_positiv.svg" alt="R+V" height="48"><a href="#">Meine R+V</a></div></header>
<section class="section section--dark"><div class="container">
  <p class="topline">Topline</p>
  <h1>Du bist nicht allein, <em>wir sind da.</em></h1>
  <p>Fließtext in RuV Sans Regular, Hervorhebung <strong>Black</strong>.</p>
  <a class="btn btn--primary" href="#">Jetzt berechnen</a> <a class="btn btn--ghost" href="#">Mehr erfahren</a>
</div></section>
<section class="section"><div class="container">
  <h2>Karten</h2>
  <div class="grid">
    <div class="card"><h3><i class="ruv-i-danger" aria-hidden="true"></i> Haftpflicht</h3><p>Beispieltext.</p><a href="#">Jetzt informieren</a></div>
    <div class="card card--sand"><h3>Hausrat</h3><p>Beispieltext.</p><a href="#">Jetzt informieren</a></div>
  </div>
  <h2 style="margin-top:2rem">Formular</h2>
  <form style="max-width:24rem"><label for="n">Name</label><input id="n"><p></p><button class="btn btn--primary" type="button">Absenden</button></form>
</div></section>
<section class="section section--sand"><div class="container"><h2>KI-Label</h2><img src="../assets/ki-label/rgb/KI_positiv.svg" alt="KI-generiert" width="80"></div></section>
<footer class="footer"><div class="container">Genossenschaftliche Finanzgruppe</div></footer>
</body></html>
